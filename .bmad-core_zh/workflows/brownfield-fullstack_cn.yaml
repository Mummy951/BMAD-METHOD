workflow:
  id: brownfield-fullstack
  name: 老旧系统全栈增强
  description: >-
    用于通过新功能、现代化或重大更改来增强现有全栈应用程序的代理工作流。
    处理现有系统分析和安全集成。
  type: brownfield
  project_types:
    - feature-addition
    - refactoring
    - modernization
    - integration-enhancement

  sequence:
    - step: enhancement_classification
      agent: analyst
      action: 分类增强范围
      notes: |
        确定增强复杂性以路由到适当的路径：
        - 单一故事（< 4 小时）→ 使用 brownfield-create-story 任务
        - 小型功能（1-3 个故事）→ 使用 brownfield-create-epic 任务
        - 主要增强（多个史诗）→ 继续完整工作流

        询问用户：“您能描述一下增强范围吗？这是小修补、功能添加还是需要架构更改的重大增强？”

    - step: routing_decision
      condition: based_on_classification
      routes:
        single_story:
          agent: pm
          uses: brownfield-create-story
          notes: "创建用于立即实现的单一故事。故事创建后退出工作流。"
        small_feature:
          agent: pm
          uses: brownfield-create-epic
          notes: "创建包含 1-3 个故事的重点史诗。史诗创建后退出工作流。"
        major_enhancement:
          continue: to_next_step
          notes: "继续下面的综合规划工作流。"

    - step: documentation_check
      agent: analyst
      action: 检查现有文档
      condition: major_enhancement_path
      notes: |
        检查是否存在足够的项目文档：
        - 查找现有的架构文档、API 规范、编码标准
        - 评估文档是否最新和全面
        - 如果足够：跳过 document-project，直接进行 PRD
        - 如果不足：首先运行 document-project

    - step: project_analysis
      agent: architect
      action: 分析现有项目并使用任务 document-project
      creates: brownfield-architecture.md (或多个文档)
      condition: documentation_inadequate
      notes: "运行 document-project 以捕获当前系统状态、技术债务和约束。将调查结果传递给 PRD 创建。"

    - agent: pm
      creates: prd.md
      uses: brownfield-prd-tmpl
      requires: existing_documentation_or_analysis
      notes: |
        为主要增强创建 PRD。如果已运行 document-project，请参考其输出以避免重新分析。
        如果跳过，请使用现有项目文档。
        保存输出：将最终的 prd.md 复制到项目的 docs/ 文件夹。

    - step: architecture_decision
      agent: pm/architect
      action: 确定是否需要架构文档
      condition: after_prd_creation
      notes: |
        审查 PRD 以确定是否需要架构规划：
        - 新的架构模式 → 创建架构文档
        - 新的库/框架 → 创建架构文档
        - 平台/基础设施更改 → 创建架构文档
        - 遵循现有模式 → 跳到故事创建

    - agent: architect
      creates: architecture.md
      uses: brownfield-architecture-tmpl
      requires: prd.md
      condition: architecture_changes_needed
      notes: "仅为重大架构更改创建架构。保存输出：将最终的 architecture.md 复制到项目的 docs/ 文件夹。"

    - agent: po
      validates: all_artifacts
      uses: po-master-checklist
      notes: "验证所有文档的集成安全性和完整性。可能需要更新任何文档。"

    - agent: various
      updates: any_flagged_documents
      condition: po_checklist_issues
      notes: "如果 PO 发现问题，返回给相关代理修复并将更新的文档重新导出到 docs/ 文件夹。"

    - agent: po
      action: 拆分文档
      creates: sharded_docs
      requires: all_artifacts_in_project
      notes: |
        为 IDE 开发拆分文档：
        - 选项 A：使用 PO 代理拆分：@po 然后要求拆分 docs/prd.md
        - 选项 B：手动：将 shard-doc 任务 + docs/prd.md 拖入聊天
        - 创建 docs/prd/ 和 docs/architecture/ 文件夹，其中包含拆分内容

    - agent: sm
      action: 创建故事
      creates: story.md
      requires: sharded_docs_or_brownfield_docs
      repeats: for_each_epic_or_enhancement
      notes: |
        故事创建周期：
        - 对于拆分 PRD：@sm → *create (使用 create-next-story)
        - 对于老旧系统文档：@sm → 使用 create-brownfield-story 任务
        - 从可用文档创建故事
        - 故事开始处于“草稿”状态
        - 可能需要为老旧系统收集额外的上下文

    - agent: analyst/pm
      action: 审查草稿故事
      updates: story.md
      requires: story.md
      optional: true
      condition: user_wants_story_review
      notes: |
        可选：审查并批准草稿故事
        - 注意：故事审查任务即将推出
        - 审查故事的完整性和对齐性
        - 更新故事状态：草稿 → 已批准

    - agent: dev
      action: 实施故事
      creates: implementation_files
      requires: story.md
      notes: |
        开发代理（新聊天）：@dev
        - 实施已批准的故事
        - 使用所有更改更新文件列表
        - 完成后将故事标记为“审查”

    - agent: qa
      action: 审查实施
      updates: implementation_files
      requires: implementation_files
      optional: true
      notes: |
        可选：QA 代理（新聊天）：@qa → review-story
        - 具有重构能力的高级开发人员审查
        - 直接修复小问题
        - 为剩余项目留下清单
        - 更新故事状态（审查 → 完成或保持审查）

    - agent: dev
      action: 处理 QA 反馈
      updates: implementation_files
      condition: qa_left_unchecked_items
      notes: |
        如果 QA 留下未检查的项目：
        - 开发代理（新聊天）：处理剩余项目
        - 返回给 QA 进行最终批准

    - repeat_development_cycle:
      action: 继续所有故事
      notes: |
        重复所有史诗故事的故事周期（SM → 开发 → QA）
        继续直到 PRD 中的所有故事完成

    - agent: po
      action: 史诗回顾
      creates: epic-retrospective.md
      condition: epic_complete
      optional: true
      notes: |
        可选：史诗完成后
        - 注意：史诗回顾任务即将推出
        - 验证史诗是否正确完成
        - 记录学习和改进

    - workflow_end:
      action: 项目完成
      notes: |
        所有故事都已实施并审查！
        项目开发阶段完成。

        参考：.bmad-core/data/bmad-kb.md#IDE Development Workflow

  flow_diagram: |
    ```mermaid
    graph TD
        A[开始：老旧系统增强] --> B[分析师：分类增强范围]
        B --> C{增强规模？}

        C -->|单一故事| D[产品经理：创建老旧系统故事]
        C -->|1-3 个故事| E[产品经理：创建老旧系统史诗]
        C -->|主要增强| F[分析师：检查文档]

        D --> END1[转到开发实施]
        E --> END2[转到故事创建]

        F --> G{文档是否足够？}
        G -->|否| H[架构师：项目文档]
        G -->|是| I[产品经理：老旧系统 PRD]
        H --> I

        I --> J{需要架构吗？}
        J -->|是| K[架构师：architecture.md]
        J -->|否| L[产品负责人：验证工件]
        K --> L

        L --> M{产品负责人发现问题吗？}
        M -->|是| N[修复问题]
        M -->|否| O[产品负责人：拆分文档]
        N --> L

        O --> P[Scrum Master：创建故事]
        P --> Q{故事类型？}
        Q -->|拆分 PRD| R[创建下一个故事]
        Q -->|老旧系统文档| S[创建老旧系统故事]

        R --> T{审查草稿？}
        S --> T
        T -->|是| U[审查并批准]
        T -->|否| V[开发人员：实施]
        U --> V

        V --> W{QA 审查？}
        W -->|是| X[QA：审查]
        W -->|否| Y{更多故事？}
        X --> Z{问题？}
        Z -->|是| AA[开发人员：修复]
        Z -->|否| Y
        AA --> X
        Y -->|是| P
        Y -->|否| AB{回顾？}
        AB -->|是| AC[产品负责人：回顾]
        AB -->|否| AD[完成]
        AC --> AD

        style AD fill:#90EE90
        style END1 fill:#90EE90
        style END2 fill:#90EE90
        style D fill:#87CEEB
        style E fill:#87CEEB
        style I fill:#FFE4B5
        style K fill:#FFE4B5
        style O fill:#ADD8E6
        style P fill:#ADD8E6
        style V fill:#ADD8E6
        style U fill:#F0E68C
        style X fill:#F0E68C
        style AC fill:#F0E68C
    ```

  decision_guidance:
    when_to_use:
      - 增强需要协调的故事
      - 需要架构更改
      - 需要大量集成工作
      - 需要风险评估和缓解计划
      - 多个团队成员将处理相关更改

  handoff_prompts:
    classification_complete: |
      增强分类为：{{enhancement_type}}
      {{if single_story}}：正在进行 brownfield-create-story 任务以立即实施。
      {{if small_feature}}：正在创建带有 brownfield-create-epic 任务的重点史诗。
      {{if major_enhancement}}：继续进行综合规划工作流。

    documentation_assessment: |
      文档评估完成：
      {{if adequate}}：现有文档足够。直接进行 PRD 创建。
      {{if inadequate}}：正在运行 document-project 以在 PRD 之前捕获当前系统状态。

    document_project_to_pm: |
      项目分析完成。关键发现记录在：
      - {{document_list}}
      使用这些发现来指导 PRD 创建并避免重新分析相同方面。

    pm_to_architect_decision: |
      PRD 完成并保存为 docs/prd.md。
      识别出架构更改：{{yes/no}}
      {{if yes}}：正在创建架构文档：{{specific_changes}}
      {{if no}}：不需要架构更改。进行验证。

    architect_to_po: "架构完成。将其保存为 docs/architecture.md。请验证所有工件的集成安全性。"

    po_to_sm: |
      所有工件均已验证。
      可用文档类型：{{sharded_prd / brownfield_docs}}
      {{if sharded}}：使用标准 create-next-story 任务。
      {{if brownfield}}：使用 create-brownfield-story 任务处理各种文档格式。

    sm_story_creation: |
      正在从 {{documentation_type}} 创建故事。
      {{if missing_context}}：可能需要在故事创建期间从用户那里收集额外的上下文。

    complete: "所有规划工件均已验证，开发可以开始。故事将根据可用文档格式创建。"