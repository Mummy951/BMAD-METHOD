workflow:
  id: brownfield-ui
  name: 老旧系统用户界面/前端增强
  description: >-
    用于通过新功能、现代化或设计改进来增强现有前端应用程序的代理工作流。
    处理现有用户界面分析和安全集成。
  type: brownfield
  project_types:
    - ui-modernization
    - framework-migration
    - design-refresh
    - frontend-enhancement

  sequence:
    - step: ui_analysis
      agent: architect
      action: 分析现有项目并使用任务 document-project
      creates: 多个文档（根据 document-project 模板）
      notes: "审查现有前端应用程序、用户反馈、分析数据，并识别改进领域。"

    - agent: pm
      creates: prd.md
      uses: brownfield-prd-tmpl
      requires: existing_ui_analysis
      notes: "创建侧重于现有系统分析的用户界面增强综合 PRD。保存输出：将最终的 prd.md 复制到项目的 docs/ 文件夹。"

    - agent: ux-expert
      creates: front-end-spec.md
      uses: front-end-spec-tmpl
      requires: prd.md
      notes: "创建与现有设计模式集成的用户界面/用户体验规范。保存输出：将最终的 front-end-spec.md 复制到项目的 docs/ 文件夹。"

    - agent: architect
      creates: architecture.md
      uses: brownfield-architecture-tmpl
      requires:
        - prd.md
        - front-end-spec.md
      notes: "创建包含组件集成策略和迁移规划的前端架构。保存输出：将最终的 architecture.md 复制到项目的 docs/ 文件夹。"

    - agent: po
      validates: all_artifacts
      uses: po-master-checklist
      notes: "验证所有文档的用户界面集成安全性和设计一致性。可能需要更新任何文档。"

    - agent: various
      updates: any_flagged_documents
      condition: po_checklist_issues
      notes: "如果 PO 发现问题，返回给相关代理修复并将更新的文档重新导出到 docs/ 文件夹。"

    - agent: po
      action: 拆分文档
      creates: sharded_docs
      requires: all_artifacts_in_project
      notes: |
        为 IDE 开发拆分文档：
        - 选项 A：使用 PO 代理拆分：@po 然后要求拆分 docs/prd.md
        - 选项 B：手动：将 shard-doc 任务 + docs/prd.md 拖入聊天
        - 创建 docs/prd/ 和 docs/architecture/ 文件夹，其中包含拆分内容

    - agent: sm
      action: 创建故事
      creates: story.md
      requires: sharded_docs
      repeats: for_each_epic
      notes: |
        故事创建周期：
        - SM 代理（新聊天）：@sm → *create
        - 从拆分文档创建下一个故事
        - 故事开始处于“草稿”状态

    - agent: analyst/pm
      action: 审查草稿故事
      updates: story.md
      requires: story.md
      optional: true
      condition: user_wants_story_review
      notes: |
        可选：审查并批准草稿故事
        - 注意：故事审查任务即将推出
        - 审查故事的完整性和对齐性
        - 更新故事状态：草稿 → 已批准

    - agent: dev
      action: 实施故事
      creates: implementation_files
      requires: story.md
      notes: |
        开发代理（新聊天）：@dev
        - 实施已批准的故事
        - 使用所有更改更新文件列表
        - 完成后将故事标记为“审查”

    - agent: qa
      action: 审查实施
      updates: implementation_files
      requires: implementation_files
      optional: true
      notes: |
        可选：QA 代理（新聊天）：@qa → review-story
        - 具有重构能力的高级开发人员审查
        - 直接修复小问题
        - 为剩余项目留下清单
        - 更新故事状态（审查 → 完成或保持审查）

    - agent: dev
      action: 处理 QA 反馈
      updates: implementation_files
      condition: qa_left_unchecked_items
      notes: |
        如果 QA 留下未检查的项目：
        - 开发代理（新聊天）：处理剩余项目
        - 返回给 QA 进行最终批准

    - repeat_development_cycle:
      action: 继续所有故事
      notes: |
        重复所有史诗故事的故事周期（SM → 开发 → QA）
        继续直到 PRD 中的所有故事完成

    - agent: po
      action: 史诗回顾
      creates: epic-retrospective.md
      condition: epic_complete
      optional: true
      notes: |
        可选：史诗完成后
        - 注意：史诗回顾任务即将推出
        - 验证史诗是否正确完成
        - 记录学习和改进

    - workflow_end:
      action: 项目完成
      notes: |
        所有故事都已实施并审查！
        项目开发阶段完成。

        参考：.bmad-core/data/bmad-kb.md#IDE Development Workflow

  flow_diagram: |
    ```mermaid
    graph TD
        A[开始：用户界面增强] --> B[分析师：分析现有用户界面]
        B --> C[产品经理：prd.md]
        C --> D[用户体验专家：front-end-spec.md]
        D --> E[架构师：architecture.md]
        E --> F[产品负责人：使用 po-master-checklist 验证]
        F --> G{产品负责人发现问题吗？}
        G -->|是| H[返回给相关代理进行修复]
        G -->|否| I[产品负责人：拆分文档]
        H --> F

        I --> J[Scrum Master：创建故事]
        J --> K{审查草稿故事？}
        K -->|是| L[分析师/产品经理：审查并批准故事]
        K -->|否| M[开发人员：实施故事]
        L --> M
        M --> N{QA 审查？}
        N -->|是| O[QA：审查实施]
        N -->|否| P{更多故事？}
        O --> Q{QA 发现问题吗？}
        Q -->|是| R[开发人员：处理 QA 反馈]
        Q -->|否| P
        R --> O
        P -->|是| J
        P -->|否| S{史诗回顾？}
        S -->|是| T[产品负责人：史诗回顾]
        S -->|否| U[项目完成]
        T --> U

        style U fill:#90EE90
        style I fill:#ADD8E6
        style J fill:#ADD8E6
        style M fill:#ADD8E6
        style C fill:#FFE4B5
        style D fill:#FFE4B5
        style E fill:#FFE4B5
        style L fill:#F0E68C
        style O fill:#F0E68C
        style T fill:#F0E68C
    ```

  decision_guidance:
    when_to_use:
      - 用户界面增强需要协调的故事
      - 需要设计系统更改
      - 需要新的组件模式
      - 需要用户研究和测试
      - 多个团队成员将处理相关更改

  handoff_prompts:
    analyst_to_pm: "用户界面分析完成。创建包含用户界面集成策略的综合 PRD。"
    pm_to_ux: "PRD 已准备就绪。将其保存为 docs/prd.md，然后创建用户界面/用户体验规范。"
    ux_to_architect: "用户界面/用户体验规范完成。将其保存为 docs/front-end-spec.md，然后创建前端架构。"
    architect_to_po: "架构完成。将其保存为 docs/architecture.md。请验证所有工件的用户界面集成安全性。"
    po_issues: "产品负责人发现 [文档] 存在问题。请返回给 [代理] 进行修复并重新保存更新的文档。"
    complete: "所有规划工件均已验证并保存在 docs/ 文件夹中。转移到 IDE 环境开始开发。"