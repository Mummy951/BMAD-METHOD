workflow:
  id: greenfield-fullstack
  name: 绿地全栈应用开发
  description: >-
    用于从概念到开发构建全栈应用程序的代理工作流。
    支持复杂项目的综合规划和简单项目的快速原型开发。
  type: greenfield
  project_types:
    - web-app
    - saas
    - enterprise-app
    - prototype
    - mvp

  sequence:
    - agent: analyst
      creates: project-brief.md
      optional_steps:
        - brainstorming_session
        - market_research_prompt
      notes: "可以先进行头脑风暴，然后进行可选的深入研究，然后再创建项目简介。保存输出：将最终的 project-brief.md 复制到项目的 docs/ 文件夹。"

    - agent: pm
      creates: prd.md
      requires: project-brief.md
      notes: "使用 prd-tmpl 从项目简介创建 PRD。保存输出：将最终的 prd.md 复制到项目的 docs/ 文件夹。"

    - agent: ux-expert
      creates: front-end-spec.md
      requires: prd.md
      optional_steps:
        - user_research_prompt
      notes: "使用 front-end-spec-tmpl 创建 UI/UX 规范。保存输出：将最终的 front-end-spec.md 复制到项目的 docs/ 文件夹。"

    - agent: ux-expert
      creates: v0_prompt (可选)
      requires: front-end-spec.md
      condition: user_wants_ai_generation
      notes: "可选但推荐：为 v0、Lovable 等工具生成 AI UI 提示。使用 generate-ai-frontend-prompt 任务。用户可以在外部工具中生成 UI 并下载项目结构。"

    - agent: architect
      creates: fullstack-architecture.md
      requires:
        - prd.md
        - front-end-spec.md
      optional_steps:
        - technical_research_prompt
        - review_generated_ui_structure
      notes: "使用 fullstack-architecture-tmpl 创建全面的架构。如果用户使用 v0/Lovable 生成了 UI，则可以将项目结构合并到架构中。可能会建议更改 PRD 故事或添加新故事。保存输出：将最终的 fullstack-architecture.md 复制到项目的 docs/ 文件夹。"

    - agent: pm
      updates: prd.md (如果需要)
      requires: fullstack-architecture.md
      condition: architecture_suggests_prd_changes
      notes: "如果架构师建议更改故事，请更新 PRD 并将完整的未经编辑的 prd.md 重新导出到 docs/ 文件夹。"

    - agent: po
      validates: all_artifacts
      uses: po-master-checklist
      notes: "验证所有文档的一致性和完整性。可能需要更新任何文档。"

    - agent: various
      updates: any_flagged_documents
      condition: po_checklist_issues
      notes: "如果 PO 发现问题，返回给相关代理修复并将更新的文档重新导出到 docs/ 文件夹。"

    - project_setup_guidance:
      action: 指导项目结构
      condition: user_has_generated_ui
      notes: "如果用户使用 v0/Lovable 生成了 UI：对于多仓库设置，将下载的项目放置在单独的前端仓库中，与后端仓库并行。对于单仓库，放置在 apps/web 或 packages/frontend 目录中。请查阅架构文档以获取具体指导。"

    - development_order_guidance:
      action: 指导开发顺序
      notes: "根据 PRD 故事：如果故事偏重前端，请首先启动前端项目/目录。如果偏重后端或 API 优先，请启动后端。对于紧密耦合的功能，请在单仓库设置中遵循故事顺序。参考拆分的 PRD 史诗以获取开发顺序。"

    - agent: po
      action: 拆分文档
      creates: sharded_docs
      requires: all_artifacts_in_project
      notes: |
        为 IDE 开发拆分文档：
        - 选项 A：使用 PO 代理拆分：@po 然后要求拆分 docs/prd.md
        - 选项 B：手动：将 shard-doc 任务 + docs/prd.md 拖入聊天
        - 创建 docs/prd/ 和 docs/architecture/ 文件夹，其中包含拆分内容

    - agent: sm
      action: 创建故事
      creates: story.md
      requires: sharded_docs
      repeats: for_each_epic
      notes: |
        故事创建周期：
        - SM 代理（新聊天）：@sm → *create
        - 从拆分文档创建下一个故事
        - 故事开始处于“草稿”状态

    - agent: analyst/pm
      action: 审查草稿故事
      updates: story.md
      requires: story.md
      optional: true
      condition: user_wants_story_review
      notes: |
        可选：审查并批准草稿故事
        - 注意：故事审查任务即将推出
        - 审查故事的完整性和对齐性
        - 更新故事状态：草稿 → 已批准

    - agent: dev
      action: 实施故事
      creates: implementation_files
      requires: story.md
      notes: |
        开发代理（新聊天）：@dev
        - 实施已批准的故事
        - 使用所有更改更新文件列表
        - 完成后将故事标记为“审查”

    - agent: qa
      action: 审查实施
      updates: implementation_files
      requires: implementation_files
      optional: true
      notes: |
        可选：QA 代理（新聊天）：@qa → review-story
        - 具有重构能力的高级开发人员审查
        - 直接修复小问题
        - 为剩余项目留下清单
        - 更新故事状态（审查 → 完成或保持审查）

    - agent: dev
      action: 处理 QA 反馈
      updates: implementation_files
      condition: qa_left_unchecked_items
      notes: |
        如果 QA 留下未检查的项目：
        - 开发代理（新聊天）：处理剩余项目
        - 返回给 QA 进行最终批准

    - repeat_development_cycle:
      action: 继续所有故事
      notes: |
        重复所有史诗故事的故事周期（SM → 开发 → QA）
        继续直到 PRD 中的所有故事完成

    - agent: po
      action: 史诗回顾
      creates: epic-retrospective.md
      condition: epic_complete
      optional: true
      notes: |
        可选：史诗完成后
        - 注意：史诗回顾任务即将推出
        - 验证史诗是否正确完成
        - 记录学习和改进

    - workflow_end:
      action: 项目完成
      notes: |
        所有故事都已实施并审查！
        项目开发阶段完成。

        参考：.bmad-core/data/bmad-kb.md#IDE Development Workflow

  flow_diagram: |
    ```mermaid
    graph TD
        A[开始：绿地项目] --> B[分析师：项目简介.md]
        B --> C[产品经理：prd.md]
        C --> D[用户体验专家：前端规格.md]
        D --> D2{生成 v0 提示？}
        D2 -->|是| D3[用户体验专家：创建 v0 提示]
        D2 -->|否| E[架构师：全栈架构.md]
        D3 --> D4[用户：在 v0/Lovable 中生成 UI]
        D4 --> E
        E --> F{架构建议 PRD 更改？}
        F -->|是| G[产品经理：更新 prd.md]
        F -->|否| H[产品负责人：验证所有工件]
        G --> H
        H --> I{产品负责人发现问题吗？}
        I -->|是| J[返回给相关代理进行修复]
        I -->|否| K[产品负责人：拆分文档]
        J --> H

        K --> L[Scrum Master：创建故事]
        L --> M{审查草稿故事？}
        M -->|是| N[分析师/产品经理：审查并批准故事]
        M -->|否| O[开发人员：实施故事]
        N --> O
        O --> P{QA 审查？}
        P -->|是| Q[QA：审查实施]
        P -->|否| R{更多故事？}
        Q --> S{QA 发现问题吗？}
        S -->|是| T[开发人员：处理 QA 反馈]
        S -->|否| R
        T --> Q
        R -->|是| L
        R -->|否| U{史诗回顾？}
        U -->|是| V[产品负责人：史诗回顾]
        U -->|否| W[项目完成]
        V --> W

        B -.-> B1[可选：头脑风暴]
        B -.-> B2[可选：市场研究]
        D -.-> D1[可选：用户研究]
        E -.-> E1[可选：技术研究]

        style W fill:#90EE90
        style K fill:#ADD8E6
        style L fill:#ADD8E6
        style O fill:#ADD8E6
        style D3 fill:#E6E6FA
        style D4 fill:#E6E6FA
        style B fill:#FFE4B5
        style C fill:#FFE4B5
        style D fill:#FFE4B5
        style E fill:#FFE4B5
        style N fill:#F0E68C
        style Q fill:#F0E68C
        style V fill:#F0E68C
    ```

  decision_guidance:
    when_to_use:
      - 构建生产就绪的应用程序
      - 多个团队成员将参与
      - 复杂的功能需求
      - 需要全面的文档
      - 预期长期维护
      - 企业或面向客户的应用程序

  handoff_prompts:
    analyst_to_pm: "项目简介已完成。将其保存为项目中的 docs/project-brief.md，然后创建 PRD。"
    pm_to_ux: "PRD 已准备就绪。将其保存为项目中的 docs/prd.md，然后创建 UI/UX 规范。"
    ux_to_architect: "UI/UX 规格完成。将其保存为项目中的 docs/front-end-spec.md，然后创建全栈架构。"
    architect_review: "架构完成。将其保存为 docs/fullstack-architecture.md。您是否建议对 PRD 故事进行任何更改或需要添加新故事？"
    architect_to_pm: "请更新 PRD，并根据建议的故事更改，然后将完整的 prd.md 重新导出到 docs/。"
    updated_to_po: "所有文档都已在 docs/ 文件夹中准备就绪。请验证所有工件的一致性。"
    po_issues: "产品负责人发现 [文档] 存在问题。请返回给 [代理] 进行修复并重新保存更新的文档。"
    complete: "所有规划工件均已验证并保存在 docs/ 文件夹中。转移到 IDE 环境开始开发。"